<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final Sellpia 0705</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: #101827;
      color: #f8fafc;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      box-sizing: border-box;
    }
    main {
      width: min(760px, 100%);
      background: #172033;
      border: 1px solid #2b3858;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .36);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 0;
    }
    p, li {
      color: #cbd5e1;
      line-height: 1.65;
    }
    code {
      color: #bfdbfe;
      background: #111827;
      border: 1px solid #27344f;
      border-radius: 6px;
      padding: 2px 6px;
    }
    .bookmarklet {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      margin: 18px 0 10px;
      padding: 0 20px;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(37, 99, 235, .28);
    }
    button {
      min-height: 40px;
      border: 1px solid #42526f;
      border-radius: 8px;
      padding: 0 14px;
      background: #253149;
      color: #e5e7eb;
      font-weight: 800;
      cursor: pointer;
    }
    #copy-status {
      margin-left: 10px;
      color: #86efac;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main>
    <h1>Final Sellpia 0705</h1>
    <p>
      새 안정화 북마클렛입니다.
      <code>재고매칭탭</code>에서는 스크래퍼를, <code>주문조회탭</code>에서는 메모/배송보류 업데이터를 실행합니다.
    </p>
    <a id="bookmarklet" class="bookmarklet" href="#">Final Sellpia 0705</a>
    <div>
      <button id="copy" type="button">북마클렛 주소 복사</button>
      <span id="copy-status"></span>
    </div>
    <ul>
      <li>주문조회탭 업데이터는 접수일과 오전/오후 묶음으로 나누어 순차 처리합니다.</li>
      <li>실행 중 성공/실패 수와 현재 처리 중인 송장을 상단에서 바로 확인할 수 있습니다.</li>
      <li>실패가 있으면 <code>실패내역 복사</code> 버튼으로 오류 내용을 바로 전달할 수 있습니다.</li>
      <li>기존 <code>Final Sellpia V1</code> 북마클렛과 헷갈리지 않도록 새 이름으로 등록하세요.</li>
    </ul>
  </main>
  <script>
    const href = "javascript:(async()=>{const u='https://raw.githubusercontent.com/kimhyein0214-dot/FULL_System/main/Final_Sellpia_0705.js?v='+Date.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Final Sellpia 0705 로드 실패: '+r.status);(0,eval)(await r.text());})().catch(e=>alert(e&&e.message?e.message:e))";
    document.getElementById('bookmarklet').href = href;
    document.getElementById('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(href);
      const status = document.getElementById('copy-status');
      status.textContent = '복사됨';
      setTimeout(() => { status.textContent = ''; }, 1800);
    });
  </script>
</body>
</html>
